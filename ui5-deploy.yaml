specVersion: "4.0"
metadata:
  name: zppbomautomation
type: application
builder:
  componentPreload:
    excludes:
      - zppbomautomation/thirdparty/**
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: BAS_CONNECT_NEW
          url: https://my433488.s4hana.cloud.sap
          scp: true
          authenticationType: reentranceTicket
        app:
          name: ZC_BOM_HDR_N
          package: ZPP_BOMCREATION_API
          transport: EGFK902357
        exclude:
          - /test/
          - /localService/
